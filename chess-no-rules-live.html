<title>Шахматы без правил</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky scoreboard on top, goal strip, square board, command bar, log. Dark single look. */
:root{--bg:#14141b;--panel:#1f1f2b;--panel2:#2a2a3a;--fg:#ececf4;--mute:#9a9ab0;--accent:#ffcf4a;--you:#7be08f;--cpu:#ff8d8d;--sqL:#f0d9b5;--sqD:#b58863;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;display:flex;flex-direction:column;align-items:center;gap:10px}
.wrap{width:100%;max-width:540px;min-width:0}
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#000;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 6px;margin-inline:-16px;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#000}
#hud div{text-align:center;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#hud b{display:block;font-size:20px;color:var(--accent);letter-spacing:0;text-transform:none}
#hud b.small{font-size:14px;padding-top:4px}
#goal{background:var(--panel2);padding:8px 12px;border-radius:8px;text-align:center}
#goal b{color:var(--accent)}
#board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;width:100%;border:4px solid #000;border-radius:4px;overflow:hidden}
.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(22px,8.5vw,46px);line-height:1;cursor:pointer;user-select:none;position:relative;min-width:0}
.sq.l{background:var(--sqL)}.sq.d{background:var(--sqD)}
.sq.sel{outline:4px solid var(--accent);outline-offset:-4px}
.sq .w{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 1px #000}
.sq .k{color:#111;text-shadow:0 0 2px #fff,0 0 1px #fff}
.sq.fx{animation:fx .7s}
@keyframes fx{0%{background:#fff}40%{background:#ff7a00}100%{}}
@media (prefers-reduced-motion:reduce){.sq.fx{animation:none}}
#bar{display:flex;gap:8px}
#bar input{flex:1;min-width:0;padding:12px;border-radius:8px;border:1px solid #444;background:var(--panel);color:var(--fg);font-size:16px}
#bar input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{padding:0 16px;border:0;border-radius:8px;background:var(--accent);color:#1a1400;font-weight:700;font-size:15px;cursor:pointer}
button[disabled]{opacity:.5;cursor:default}
button.ghost{background:var(--panel2);color:var(--fg)}
#chips{display:flex;flex-wrap:wrap;gap:6px}
#chips button{padding:6px 10px;font-size:13px;font-weight:500;background:var(--panel2);color:var(--fg);border-radius:999px}
#status{min-height:20px;color:var(--mute);font-size:13px}
#log{background:var(--panel);border-radius:8px;padding:8px 10px;max-height:240px;overflow:auto}
#log div{padding:3px 0;border-bottom:1px solid #ffffff10}
#log .you{color:var(--you)}#log .cpu{color:var(--cpu)}#log .sys{color:var(--mute)}
</style>
<div class="wrap" id="hud">
 <div>Ход<b id="turn">1</b></div>
 <div>Вы<b id="sw">0</b></div>
 <div>Компьютер<b id="sb">0</b></div>
 <div>Мир<b class="small" id="world">Шахматы</b></div>
</div>
<div class="wrap" id="goal"></div>
<div class="wrap" id="board"></div>
<div class="wrap" id="bar">
 <input id="in" autocomplete="off" placeholder="Любой запрос: построй дом, ядерная бомба, призови дракона…">
 <button id="go">Ход</button><button id="stop" class="ghost" hidden>Стоп</button>
</div>
<div class="wrap" id="status"></div>
<div class="wrap" id="chips"></div>
<div class="wrap" id="log"></div>
<div class="wrap" style="font-size:12px;color:var(--mute)">Правил нет: кликните свою фигуру и любую клетку, чтобы переставить её (это тоже ход). Победа — взять чёрного короля. Запросы выполняет Claude и расходует ваш лимит Claude; без доступа к Claude работают простые команды.</div>
<script>
const GL={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
const VAL={K:10,Q:9,R:5,B:3,N:3,P:1};
const GOALS=['Возьмите чёрного короля любым способом','Постройте дом и спрячьте в нём короля','Взорвите всё ядерной бомбой','Призовите существо на свою сторону','Уничтожьте королеву врага','Телепортируйтесь в Minecraft','Придумайте свой запрос — всё разрешено'];
const IDEAS=['построй дом','ядерная бомба','призови дракона','уничтожь королеву','возроди фигуры','Minecraft','построй стену перед королём','потоп'];
const $=id=>document.getElementById(id);
let b,sel=null,turn=1,score={w:0,k:0},over=false,busy=false,sample=null,ctl=null,fxCells=new Set();
function init(){
 b=Array.from({length:64},()=>null);
 'RNBQKBNR'.split('').forEach((t,i)=>{b[i]={t,s:'k'};b[56+i]={t,s:'w'};b[8+i]={t:'P',s:'k'};b[48+i]={t:'P',s:'w'}});
 theme({l:'#f0d9b5',d:'#b58863'});$('world').textContent='Шахматы';
}
function theme(o){const ok=v=>typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v);
 if(ok(o.l))document.documentElement.style.setProperty('--sqL',o.l);
 if(ok(o.d))document.documentElement.style.setProperty('--sqD',o.d);
 if(typeof o.world==='string')$('world').textContent=o.world.slice(0,18)}
function log(m,c){const d=document.createElement('div');d.className=c;d.textContent=m;$('log').prepend(d)}
function draw(){
 const el=$('board');el.innerHTML='';
 b.forEach((p,i)=>{const s=document.createElement('div');
  s.className='sq '+((((i>>3)+i)%2)?'d':'l')+(sel===i?' sel':'')+(fxCells.has(i)?' fx':'');
  if(p){const sp=document.createElement('span');sp.className=p.s||'';sp.textContent=p.e||GL[p.t]||'?';s.appendChild(sp)}
  s.onclick=()=>click(i);el.appendChild(s)});
 fxCells.clear();
 $('turn').textContent=turn;$('sw').textContent=score.w;$('sb').textContent=score.k;
 $('goal').innerHTML='Ваша цель: <b>'+GOALS[(turn-1)%GOALS.length]+'</b>';
}
const total=s=>b.reduce((a,p)=>a+(p&&p.s===s?(VAL[p.t]||1):0),0);
const hasK=s=>b.some(p=>p&&p.s===s&&p.t==='K');
const name=i=>'abcdefgh'[i%8]+(8-(i>>3));
const cl=(n,lo,hi)=>Math.max(lo,Math.min(hi,Math.floor(+n)||0));
function cell(o){
 const e=typeof o.e==='string'?[...o.e].slice(0,2).join(''):'';
 const s=o.s==='w'||o.s==='k'?o.s:null;
 const t=typeof o.t==='string'&&o.t?o.t.slice(0,12):null;
 if(!e&&!(t&&GL[t]))return null;
 return{e:e||undefined,s,t:s?(t||'X'):(t||'block')};
}
function apply(ops,actor){
 const foe=actor==='w'?'k':'w',before=total(foe);
 (Array.isArray(ops)?ops:[]).slice(0,120).forEach(o=>{
  if(!o||typeof o!=='object')return;
  const x=cl(o.x,0,7),y=cl(o.y,0,7),w=cl(o.w||1,1,8),h=cl(o.h||1,1,8);
  if(o.op==='theme')theme(o);
  else if(o.op==='set'){const c=cell(o);b[y*8+x]=c;fxCells.add(y*8+x)}
  else if(o.op==='clear'){b[y*8+x]=null;fxCells.add(y*8+x)}
  else if(o.op==='fill'||o.op==='clearArea'){
   for(let j=y;j<Math.min(8,y+h);j++)for(let i=x;i<Math.min(8,x+w);i++){b[j*8+i]=o.op==='fill'?cell(o):null;fxCells.add(j*8+i)}}
  else if(o.op==='fx')fxCells.add(y*8+x);
 });
 const d=before-total(foe);if(d>0)score[actor]+=d;
}
function winCheck(){
 if(!hasK('k')){finish('Вы победили: чёрный король пал!');return true}
 if(!hasK('w')){finish('Компьютер взял вашего короля.');return true}
 return false}
function finish(m){over=true;log('🏁 '+m,'sys');$('status').textContent=m+' Нажмите «Новая игра».';
 $('go').textContent='Новая игра';$('go').disabled=false;$('in').disabled=true}
function setBusy(v,msg){busy=v;$('go').disabled=v;$('in').disabled=v;$('stop').hidden=!v;$('status').textContent=msg||''}

/* ---------- ход перетаскиванием ---------- */
function click(i){
 if(over||busy)return;
 if(sel===null){if(b[i]&&b[i].s==='w')sel=i}
 else if(i===sel)sel=null;
 else if(b[i]&&b[i].s==='w')sel=i;
 else{const before=total('k');const p=b[sel];b[i]=p;b[sel]=null;
  const d=before-total('k');if(d>0)score.w+=d;
  fxCells.add(i);sel=null;log('Вы: '+(p.e||GL[p.t])+' → '+name(i),'you');
  draw();if(winCheck())return;
  ask('Игрок просто переставил фигуру на '+name(i)+' (если там стояла чужая — она взята).',true);return}
 draw();
}
/* пересчёт очков за ручной ход: считаем по разнице */
let lastEnemy=null;

/* ---------- запрос к Claude ---------- */
function boardJson(){return JSON.stringify(b.map((p,i)=>p?{x:i%8,y:i>>3,e:p.e||GL[p.t],s:p.s,t:p.t}:null).filter(Boolean))}
const RULES=`Ты движок игры «Шахматы без правил» на доске 8x8. Координаты: x 0..7 слева направо, y 0..7 сверху вниз. Белые (s="w") — игрок, они внизу (y=6,7). Чёрные (s="k") — компьютер, вверху. Клетка содержит: e (эмодзи или символ), s ("w", "k" или null для предметов/построек), t (тип: K,Q,R,B,N,P для шахматных фигур, любая короткая строка для остального). Король — t="K". Шахматные фигуры без e рисуются обычными символами.
Правил нет: любой запрос выполняется буквально и творчески. «Построй дом» — реально выстрой дом из клеток (например fill/set с 🧱 стенами, 🟥 крышей, 🚪 дверью, 🪟 окнами, s=null, t="block"), на подходящем свободном месте у стороны игрока. Бомба — очисти область и поставь 💥 или ☢️ (s=null, t="fx"). Существа (дракон, робот, зомби и т.д.) — set с эмодзи, s сторона призвавшего, t="X". Minecraft — theme с цветами ("l" зелёный, "d" коричневый, "world":"Minecraft") и блоки 🟩🟫🪵. Королей убивать можно. Всё остальное придумай сам.
Формат ответа — только JSON: {"say":"короткая реплика о том, что произошло (по-русски)","ops":[...],"cpu_say":"что сделал компьютер","cpu_ops":[...]}.
Операции: {"op":"set","x":0,"y":0,"e":"🧱","s":null,"t":"block"}, {"op":"clear","x":0,"y":0}, {"op":"fill","x":0,"y":0,"w":3,"h":2,"e":"🧱","s":null,"t":"block"}, {"op":"clearArea","x":0,"y":0,"w":3,"h":3}, {"op":"theme","l":"#7cbd4a","d":"#866043","world":"Minecraft"}. Не больше 60 операций на ход. Ты исполняешь и запрос игрока (ops), и затем ответный ход компьютера (cpu_ops): компьютер тоже может делать что угодно — двигать фигуры (clear + set), взрывать, строить, призывать, брать фигуры игрока — изобретательно и с характером, но не меняй доску без смысла. Игрока нельзя лишать короля в первые 3 хода игры. Если игрок уже взял чёрного короля после его ops, cpu_ops оставь пустым.`;
async function ask(req,manual){
 const myTurn=turn;
 const sBefore={w:score.w,k:score.k};
 setBusy(true,'Claude думает…');
 let res=null;
 if(sample){
  ctl=new AbortController();
  try{res=await sample.json(RULES+'\n\nХод №'+turn+'. Текущая доска:\n'+boardJson()+'\n\nЗапрос игрока: '+req,{modelTier:'quick',signal:ctl.signal,cache:false})}
  catch(e){ if(e&&e.code==='cancelled'){setBusy(false,'Остановлено.');return}
   const hide=e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code);
   if(hide)sample=null;
   log('Claude недоступен ('+(e&&e.code||'ошибка')+'): '+(hide?'дальше работают простые команды.':'ход выполнен локально.'),'sys')}
 }
 if(!res||typeof res!=='object'||Array.isArray(res))res=manual?{say:'',ops:[],cpu_say:'',cpu_ops:null}:local(req);
 if(res.say)log('Вы: '+res.say,'you');
 if(!manual||res.ops&&res.ops.length)apply(res.ops,'w');
 draw();
 if(winCheck()){setBusy(false);return}
 let cops=res.cpu_ops,csay=res.cpu_say;
 if(!Array.isArray(cops)||!cops.length){const c=localCpu();cops=c.ops;csay=csay||c.say}
 apply(cops,'k');
 log('Компьютер: '+(csay||'сделал ход'),'cpu');
 turn=myTurn+1;draw();
 if(winCheck()){setBusy(false);return}
 setBusy(false,'');$('in').focus();
}
/* ---------- запасные локальные команды ---------- */
function find(t,s){return b.findIndex(p=>p&&p.t===t&&p.s===s)}
function empties(f){return b.map((p,i)=>p?-1:i).filter(i=>i>=0&&(!f||f(i)))}
function local(t){
 t=t.toLowerCase();const ops=[];let say='';
 const kw=find('K','k');
 if(/бомб|ядер|взрыв/.test(t)){const c=kw>=0?kw:27;ops.push({op:'clearArea',x:(c%8)-2,y:(c>>3)-2,w:5,h:5},{op:'set',x:c%8,y:c>>3,e:'☢️',s:null,t:'fx'});say='☢️ Ядерный взрыв вокруг чёрного короля'}
 else if(/дом|постро|строй/.test(t)){
  const x=2,y=4;
  for(let j=0;j<3;j++)for(let i=0;i<4;i++)if(!b[(y+j)*8+x+i]||true)ops.push({op:'set',x:x+i,y:y+j,e:j===0?'🟥':(j===2&&i===1?'🚪':(i%3===0?'🧱':'🪟')),s:null,t:'block'});
  say='🏠 Построен дом'}
 else if(/королев/.test(t)){const q=find('Q','k');if(q>=0)ops.push({op:'clear',x:q%8,y:q>>3});say='Королева врага уничтожена'}
 else if(/возрод|воскре/.test(t)){const e=empties(i=>i>=40);['Q','R','R','B','N','P'].forEach((tt,k)=>{if(e[k]!==undefined)ops.push({op:'set',x:e[k]%8,y:e[k]>>3,s:'w',t:tt})});say='✨ Фигуры возрождены'}
 else if(/minecraft|майнкрафт|майн/.test(t)){ops.push({op:'theme',l:'#7cbd4a',d:'#866043',world:'Minecraft'});say='🟩 Вы в Minecraft'}
 else say='Без Claude я понимаю: ядерная бомба, построй дом, уничтожь королеву, возроди, Minecraft';
 return{say,ops,cpu_ops:null};
}
function localCpu(){
 const mine=b.map((p,i)=>p&&p.s==='k'?i:-1).filter(i=>i>=0);
 const r=Math.random();
 if(r<.2){const c=find('K','w');if(turn>3&&c>=0){return{say:'☢️ бросил бомбу рядом с вашим королём',ops:[{op:'clearArea',x:(c%8)-1,y:(c>>3)-1,w:3,h:3}]}}}
 const a=mine[Math.floor(Math.random()*mine.length)];const t=Math.floor(Math.random()*64);
 if(a===undefined||b[t]&&b[t].s==='k'||(turn<=3&&b[t]&&b[t].t==='K'))return{say:'пропустил ход',ops:[]};
 const p=b[a];
 return{say:(p.e||GL[p.t])+' → '+name(t),ops:[{op:'clear',x:a%8,y:a>>3},{op:'set',x:t%8,y:t>>3,e:p.e,s:'k',t:p.t}]};
}
/* ---------- интерфейс ---------- */
function submit(){
 if(busy)return;
 if(over){reset();return}
 const v=$('in').value.trim();if(!v)return;$('in').value='';
 log('Запрос: «'+v+'»','you');ask(v,false);
}
function reset(){init();turn=1;score={w:0,k:0};over=false;sel=null;$('go').textContent='Ход';$('in').disabled=false;$('status').textContent='';$('log').innerHTML='';log('Новая игра. Правил нет.','sys');draw()}
$('go').onclick=submit;
$('in').onkeydown=e=>{if(e.key==='Enter')submit()};
$('stop').onclick=()=>ctl&&ctl.abort();
IDEAS.forEach(t=>{const c=document.createElement('button');c.textContent=t;c.onclick=()=>{$('in').value=t;$('in').focus()};$('chips').appendChild(c)});
init();draw();log('Игра началась. Пишите любой запрос — и всё произойдёт.','sys');
(async()=>{try{sample=await claude.use('sample')}catch(e){sample=null}
 if(!sample)$('status').textContent='Claude недоступен здесь: работают простые команды.'})();
</script>
