<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кинотеатр</title>
<style>
:root{--bg:#0b0b10;--card:#16161f;--tx:#f2f2f5;--mut:#9a9aab;--ac:#e50914}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;background:#0b0b10ee;backdrop-filter:blur(8px);padding:14px 16px;z-index:5;border-bottom:1px solid #222}
h1{margin:0;font-size:22px;color:var(--ac);letter-spacing:1px}
#q{width:100%;margin-top:10px;padding:10px 14px;border-radius:10px;border:1px solid #2a2a38;background:var(--card);color:var(--tx);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px}
.card{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer}
.poster{aspect-ratio:2/3;display:flex;align-items:flex-end;padding:12px;font-weight:800;font-size:20px;line-height:1.1;text-shadow:0 2px 8px #000}
.meta{padding:10px 12px;color:var(--mut);font-size:13px}
.meta b{display:block;color:var(--tx);font-size:15px;margin-bottom:2px}
#view{display:none;padding:16px}
.back{background:none;border:0;color:var(--ac);font-size:16px;padding:0 0 12px}
.hero{border-radius:14px;padding:22px 16px;min-height:140px;display:flex;flex-direction:column;justify-content:flex-end}
.hero h2{margin:0;font-size:28px}.hero p{margin:6px 0 0;color:#ddd}
.note{background:#241c1c;border-left:3px solid var(--ac);padding:10px 12px;border-radius:8px;color:#d8c9c9;font-size:14px;margin:14px 0}
.row{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
.row .t{font-weight:600;margin-bottom:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.b{border:0;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;color:#fff;background:var(--ac)}
button.s{background:#2a2a38}
.own{color:var(--mut);font-size:12px;margin-top:6px;word-break:break-all}
</style></head><body>
<header><h1>🎬 КИНОТЕАТР</h1><input id="q" placeholder="Поиск сериала…"></header>
<div id="list" class="grid"></div>
<div id="view"></div>
<script>
const YT=q=>'https://m.youtube.com/results?search_query='+encodeURIComponent(q);
const seasons=(n,l='Сезон')=>Array.from({length:n},(_,i)=>`${l} ${i+1}`);
const SHOWS=[
{id:'dexter',title:'Декстер',sub:'Dexter · все части',g:'linear-gradient(160deg,#7a0010,#1a0004)',
 desc:'Серийный убийца-судмедэксперт. Все сезоны, «Новая кровь» и «Воскрешение».',
 legal:true,
 items:[...seasons(8).map((s,i)=>({t:`Декстер — ${s}`,q:`Dexter season ${i+1} trailer`})),
  {t:'Декстер: Новая кровь',q:'Dexter New Blood trailer'},
  {t:'Декстер: Воскрешение — сезон 1',q:'Dexter Resurrection season 1 trailer'},
  {t:'Декстер: Воскрешение — сезон 2',q:'Dexter Resurrection season 2 trailer'}]},
{id:'bb',title:'Во все тяжкие',sub:'Breaking Bad · все сезоны',g:'linear-gradient(160deg,#0b5d1e,#031a09)',
 desc:'Учитель химии становится королём наркобизнеса. 5 сезонов.',
 legal:true,
 items:seasons(5).map((s,i)=>({t:`Во все тяжкие — ${s}`,q:`Breaking Bad season ${i+1} trailer`}))},
{id:'backrooms',title:'Закулисье (Backrooms)',sub:'Kane Pixels · YouTube',g:'linear-gradient(160deg,#c9b44a,#3b3205)',
 desc:'Found-footage хоррор про бесконечные жёлтые комнаты. Серии смотрим прямо с YouTube.',
 items:[{t:'Backrooms (Found Footage) — оригинал',q:'Kane Pixels Backrooms Found Footage 1996'},
  {t:'Backrooms — все серии Kane Pixels',q:'Kane Pixels Backrooms all episodes'},
  {t:'Backrooms — Reality / Реальность',q:'Backrooms Reality'},
  {t:'Backrooms — на русском',q:'Закулисье Backrooms Kane Pixels на русском'}]},
{id:'ava',title:'Animation vs Animator',sub:'Alan Becker · YouTube',g:'linear-gradient(160deg,#2f6bff,#050b2e)',
 desc:'Палочка оживает на компьютере аниматора. Все части с канала Алана Беккера.',
 items:[{t:'Animation vs. Animator (оригинал)',q:'Alan Becker Animation vs Animator'},
  {t:'Animation vs. Minecraft',q:'Alan Becker Animation vs Minecraft'},
  {t:'Animation vs. Math / Physics / Chess',q:'Alan Becker Animation vs Math Physics Chess'},
  {t:'Animation vs. Coding / Video Games / Pokémon',q:'Alan Becker Animation vs Coding Video Games Pokemon'},
  {t:'Все серии Alan Becker',q:'Alan Becker animation vs animator all episodes'}]}
];
const $=s=>document.querySelector(s);
const own=JSON.parse(localStorage.getItem('own')||'{}');
const save=()=>localStorage.setItem('own',JSON.stringify(own));
function home(f=''){
  $('#view').style.display='none';$('#list').style.display='grid';$('header').style.display='block';
  $('#list').innerHTML=SHOWS.filter(s=>(s.title+s.sub).toLowerCase().includes(f.toLowerCase())).map(s=>
   `<div class="card" onclick="openShow('${s.id}')"><div class="poster" style="background:${s.g}">${s.title}</div>
    <div class="meta"><b>${s.title}</b>${s.sub}</div></div>`).join('');
}
function openShow(id){
  const s=SHOWS.find(x=>x.id===id);
  $('#list').style.display='none';$('header').style.display='none';
  const v=$('#view');v.style.display='block';
  v.innerHTML=`<button class="back" onclick="home()">← Назад</button>
  <div class="hero" style="background:${s.g}"><h2>${s.title}</h2><p>${s.desc}</p></div>
  ${s.legal?`<div class="note">Этот сериал защищён авторским правом, бесплатного официального источника на YouTube нет.
  Кнопка «Трейлер» ищет официальные трейлеры; полные серии добавьте через «Моя ссылка» — вставьте адрес
  из вашей легальной подписки (Max, Paramount+, Netflix и т. п.).</div>`:''}
  ${s.items.map((it,i)=>{const k=id+i;return `<div class="row"><div class="t">${it.t}</div>
   <div class="btns"><button class="b" onclick="go(${JSON.stringify(YT(it.q))})">▶ ${s.legal?'Трейлер':'Смотреть'}</button>
   ${own[k]?`<button class="b" onclick="go(${JSON.stringify(own[k])})">▶ Моя ссылка</button>`:''}
   <button class="b s" onclick="setOwn('${id}',${i})">🔗 ${own[k]?'Изменить':'Моя ссылка'}</button></div>
   ${own[k]?`<div class="own">${own[k]}</div>`:''}</div>`}).join('')}`;
  window.scrollTo(0,0);
}
function go(u){location.href=u}
function setOwn(id,i){
  const k=id+i,u=prompt('Вставьте ссылку (https://…). Пусто — удалить:',own[k]||'');
  if(u===null)return;
  if(u.trim()===''){delete own[k]}
  else if(/^https:\/\//i.test(u.trim())){own[k]=u.trim()}
  else{alert('Нужна ссылка, начинающаяся с https://');return}
  save();openShow(id);
}
$('#q').addEventListener('input',e=>home(e.target.value));
home();
</script></body></html>
