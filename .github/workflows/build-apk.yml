name: Build APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Kinoteatr-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk kinoteatr.apk
          gh release view kinoteatr-latest >/dev/null 2>&1 || gh release create kinoteatr-latest --title "Кинотеатр (APK)" --notes "Последняя сборка" --prerelease
          gh release upload kinoteatr-latest kinoteatr.apk --clobber
