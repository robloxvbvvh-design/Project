name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: |
          npx cap add android
          cp android-patch/MainActivity.java android/app/src/main/java/com/hotelknock/game/MainActivity.java
          # горизонтальная ориентация
          sed -i "s/<activity\$/<activity android:screenOrientation=\"sensorLandscape\"/" android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hotel-knock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hotel-knock-apk
          path: hotel-knock.apk

      - name: Publish to release (easy download from phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Стук в отеле (APK)" --notes "Последняя сборка игры" --prerelease
          gh release upload apk-latest hotel-knock.apk --clobber
