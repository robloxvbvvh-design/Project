name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main, 'ccr-*']
    paths: ['www/**', 'android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.9}
      - name: Build tiny APK (WebView + одна страница)
        run: |
          cp www/index.html android/app/src/main/assets/index.html
          cd android && gradle assembleRelease --no-daemon
      - name: Publish release (direct download link)
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk studio-istorii.apk
          ls -l studio-istorii.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest studio-istorii.apk --target "$GITHUB_SHA" --title "Студия Историй (APK)" --notes "Лёгкий APK. Скачай studio-istorii.apk и установи."
      - uses: actions/upload-artifact@v4
        with: {name: studio-istorii-apk, path: studio-istorii.apk}
