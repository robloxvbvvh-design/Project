<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Стук в отеле</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;width:800px;height:450px;transform-origin:0 0;overflow:hidden;background:#1a1220;color:#fff}
canvas{position:absolute;left:0;top:0;width:800px;height:450px}
.layer{position:absolute;left:0;top:0;width:800px;height:450px;pointer-events:none}
.layer>*{pointer-events:auto}
.hidden{display:none!important}
button{font:inherit;color:#fff;border:0;border-radius:12px;cursor:pointer;touch-action:manipulation}
#coins{position:absolute;left:12px;top:8px;font-size:22px;font-weight:800;text-shadow:0 2px 4px #000;pointer-events:none}
#rage{position:absolute;left:50%;top:10px;width:260px;margin-left:-130px;height:22px;background:#0008;border:2px solid #fff6;border-radius:12px;overflow:hidden;pointer-events:none}
#rageFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#f5a623,#e5251b)}
#rageTxt{position:absolute;left:0;right:0;top:0;text-align:center;font-size:13px;line-height:22px;font-weight:700;text-shadow:0 1px 2px #000}
#menuBtn{position:absolute;right:10px;top:6px;width:40px;height:34px;background:#0008;font-size:18px}
#hub{bottom:0;height:92px;top:auto}
#sel{position:absolute;left:10px;bottom:8px;width:290px;font-size:14px}
.row{display:flex;align-items:center;gap:6px;margin-bottom:6px;background:#000a;border-radius:10px;padding:3px 4px}
.row b{flex:1;text-align:center;line-height:1.15;font-size:14px}
.row b small{display:block;font-weight:500;opacity:.85;font-size:11px}
.arr{width:38px;height:34px;background:#6b3fa0;font-size:16px;font-weight:800}
.arr:disabled{opacity:.3}
#knock{position:absolute;left:318px;bottom:10px;width:230px;height:74px;font-size:26px;font-weight:900;background:linear-gradient(#ff5a3c,#c8200e);box-shadow:0 5px 0 #7d1208;letter-spacing:1px}
#knock:active{transform:translateY(4px);box-shadow:0 1px 0 #7d1208}
#shopBtn{position:absolute;right:10px;bottom:10px;width:210px;height:74px;font-size:21px;font-weight:800;background:linear-gradient(#3ec46d,#1d8a45);box-shadow:0 5px 0 #0f5428}
#chaseUI{top:0;height:450px}
#jumpBtn,#sprintBtn{position:absolute;bottom:14px;width:170px;height:96px;font-size:24px;font-weight:900;opacity:.88}
#jumpBtn{right:14px;background:linear-gradient(#4aa3ff,#1c63c9);box-shadow:0 5px 0 #0f3c83}
#sprintBtn{left:14px;background:linear-gradient(#ffb02e,#d97a00);box-shadow:0 5px 0 #8c4d00}
#jumpBtn:active,#sprintBtn.on{transform:translateY(4px)}
#modal{background:#000b;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.card{background:#241833;border:3px solid #ffffff30;border-radius:18px;padding:18px 22px;text-align:center;max-width:560px;box-shadow:0 10px 40px #000}
.card h1{margin:0 0 8px;font-size:28px}
.card p{margin:6px 0;font-size:16px;line-height:1.35}
.card .btns{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card .btns button{padding:12px 20px;font-size:17px;font-weight:800;background:#6b3fa0}
.card .btns button.main{background:#e5481b}
.shop{width:700px;max-width:96%;height:410px;display:flex;flex-direction:column;padding:12px 16px}
.shop .top{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;margin-bottom:6px}
.shop .list{flex:1;overflow-y:auto;touch-action:pan-y;text-align:left;padding-right:4px}
.shop h3{margin:8px 0 4px;font-size:15px;opacity:.8}
.item{display:flex;align-items:center;gap:10px;background:#ffffff12;border-radius:12px;padding:7px 10px;margin-bottom:6px}
.item .ic{font-size:26px;width:34px;text-align:center}
.item .tx{flex:1;font-size:15px;font-weight:700}
.item .tx small{display:block;font-weight:500;opacity:.75;font-size:12px}
.item button{min-width:112px;padding:9px 8px;font-weight:800;font-size:14px;background:#1d8a45}
.item button:disabled{background:#555;opacity:.6}
.item.bomb{background:linear-gradient(90deg,#6a0000,#c42a00);animation:pulse 1s infinite alternate;border:2px solid #ffd54a}
.item.bomb button{background:#ffd54a;color:#400}
@keyframes pulse{to{box-shadow:0 0 22px #ff5a1f}}
#flash{background:#fff;opacity:0;pointer-events:none}
#toast{position:absolute;left:50%;top:48px;transform:translateX(-50%);background:#000c;border:2px solid #ffd54a;border-radius:12px;padding:6px 14px;font-size:15px;font-weight:700;pointer-events:none;white-space:nowrap}
#ending{background:#000;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:auto}
#endTxt{font-size:30px;font-weight:800;padding:0 40px;line-height:1.3;transition:opacity .6s}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="800" height="450"></canvas>
  <div class="layer" id="hud">
    <div id="coins">💰 0</div>
    <div id="rage"><div id="rageFill"></div><div id="rageTxt"></div></div>
    <button id="menuBtn">⚙</button>
  </div>
  <div class="layer" id="hub">
    <div id="sel">
      <div class="row"><button class="arr" id="fPrev">◀</button><b id="fLbl"></b><button class="arr" id="fNext">▶</button></div>
      <div class="row"><button class="arr" id="tPrev">◀</button><b id="tLbl"></b><button class="arr" id="tNext">▶</button></div>
    </div>
    <button id="knock">✊ ПОСТУЧАТЬ</button>
    <button id="shopBtn">🛒 Прокачка</button>
  </div>
  <div class="layer hidden" id="chaseUI">
    <button id="sprintBtn">⚡ БЕГ</button>
    <button id="jumpBtn">⤒ ПРЫЖОК</button>
  </div>
  <div id="toast" class="hidden"></div>
  <div class="layer hidden" id="modal"></div>
  <div class="layer hidden" id="ending"><div id="endTxt"></div></div>
  <div class="layer" id="flash"></div>
</div>
<script>
"use strict";
/* ============ Данные ============ */
const W = 800, H = 450, GY = 360;
const FLOORS = [
  { name: "Гости",      who: "Постоялец",  kind: "guest",    spd: 150, need: 4,  mult: 1,  skin: "#f1c27d", cloth: "#f2f2f2", line: "КТО ТАМ СТУЧИТ?!" },
  { name: "Горничные",  who: "Горничная",  kind: "maid",     spd: 180, need: 5,  mult: 2,  skin: "#e8b48a", cloth: "#222233", line: "Я ТОЛЬКО УБРАЛАСЬ!" },
  { name: "Кухня",      who: "Повар",      kind: "chef",     spd: 210, need: 6,  mult: 3,  skin: "#d9a066", cloth: "#ffffff", line: "ТЫ ПОПАЛ НА СКОВОРОДКУ!" },
  { name: "Охрана",     who: "Охранник",   kind: "guard",    spd: 240, need: 8,  mult: 5,  skin: "#c68642", cloth: "#1f3a6e", line: "СТОЯТЬ! ОХРАНА!" },
  { name: "Менеджеры",  who: "Менеджер",   kind: "manager",  spd: 270, need: 10, mult: 8,  skin: "#f1c27d", cloth: "#5a5f6b", line: "ВЫ УВОЛЕНЫ!" },
  { name: "Директор",   who: "Директор",   kind: "director", spd: 300, need: 12, mult: 12, skin: "#e0ac69", cloth: "#111111", line: "МОЙ ОТЕЛЬ?! ЛОВИТЕ ЕГО!" }
];
const TIERS = [
  { name: "Деревянная",  col: "#8b5a2b", mult: 1,  price: 0 },
  { name: "Металлическая", col: "#8a96a3", mult: 2,  price: 400 },
  { name: "Стальная",    col: "#46596b", mult: 4,  price: 2500 },
  { name: "Золотая",     col: "#e6b422", mult: 8,  price: 12000 },
  { name: "Титановая",   col: "#7d3cff", mult: 16, price: 60000 }
];
const UPS = {
  speed: { name: "Скорость бега",  ic: "👟", max: 15, base: 80,  grow: 1.55, desc: l => "+14 к скорости (сейчас " + (190 + 14 * l) + ")" },
  stam:  { name: "Выносливость",   ic: "🫁", max: 10, base: 60,  grow: 1.5,  desc: l => "Спринт " + (3 + 0.8 * l).toFixed(1) + " сек" },
  head:  { name: "Фора",           ic: "⏱", max: 10, base: 60,  grow: 1.5,  desc: l => "Преследователь стартует в " + (90 + 22 * l) + " м" },
  greed: { name: "Жадность",       ic: "🤑", max: 12, base: 150, grow: 1.7,  desc: l => "Доход ×" + (1 + 0.25 * l).toFixed(2) }
};
const BOMB_PRICE = 1000000;
const KEY = "hotelKnock_v1";

/* ============ Сохранение ============ */
function fresh() { return { coins: 0, up: { speed: 0, stam: 0, head: 0, greed: 0 }, tier: 0, rage: [0,0,0,0,0,0], allAngry: false, ended: false, hinted: false, runs: 0, total: 0 }; }
let G = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.up && s.rage) return Object.assign(fresh(), s); } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) {} }
const fmt = n => Math.floor(n).toLocaleString("ru-RU");
const upCost = k => Math.round(UPS[k].base * Math.pow(UPS[k].grow, G.up[k]));
const floorOpen = i => i === 0 || G.rage[i - 1] >= FLOORS[i - 1].need;
const rewardOf = (f, t) => Math.round(50 * TIERS[t].mult * FLOORS[f].mult * (1 + 0.25 * G.up.greed));
const hotelRage = () => { let s = 0, n = 0; FLOORS.forEach((f, i) => { s += Math.min(1, G.rage[i] / f.need); n++; }); return s / n; };

/* ============ Звук ============ */
let actx = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === "suspended") actx.resume(); return actx; }
function tone(f, d, type, vol, slide) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type || "square"; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + d);
  g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d);
}
const sfx = {
  knock: () => tone(140, 0.12, "triangle", 0.5, 50),
  jump: () => tone(300, 0.15, "square", 0.06, 600),
  hit: () => tone(120, 0.25, "sawtooth", 0.12, 40),
  coin: () => { tone(880, 0.1, "square", 0.07); setTimeout(() => tone(1320, 0.18, "square", 0.07), 90); },
  caught: () => { tone(400, 0.5, "sawtooth", 0.12, 60); },
  alarm: () => tone(700, 0.18, "square", 0.06, 500),
  boom: () => { tone(90, 2.2, "sawtooth", 0.3, 20); tone(60, 2.5, "square", 0.2, 15); },
  tick: () => tone(1000, 0.08, "square", 0.08)
};

/* ============ Масштаб ============ */
const stage = document.getElementById("stage");
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = "translate(" + ((innerWidth - W * s) / 2) + "px," + ((innerHeight - H * s) / 2) + "px) scale(" + s + ")";
}
addEventListener("resize", fit); fit();

/* ============ Отрисовка персонажей ============ */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
function limb(x1, y1, x2, y2, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function rrect(x, y, w, h, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); ctx.fill(); }

/* o: kind, skin, cloth, ph (фаза бега), run, air, angry, flip, s, knock */
function person(x, y, o) {
  const s = o.s || 1, k = o.kind;
  ctx.save(); ctx.translate(x, y); ctx.scale(o.flip ? -s : s, s);
  const sw = o.run ? Math.sin(o.ph) : 0;
  const pants = k === "player" ? "#2b2b44" : k === "guest" ? "#e0e0e0" : k === "maid" ? "#111" : k === "chef" ? "#333" : "#1b1b24";
  // ноги
  if (o.air) { limb(-4, -30, 8, -16, 9, pants); limb(8, -16, 0, -4, 9, pants); limb(4, -30, 14, -22, 9, pants); limb(14, -22, 10, -8, 9, pants); }
  else { limb(-3, -30, -3 + sw * 15, -4 - Math.abs(sw) * 2, 9, pants); limb(3, -30, 3 - sw * 15, -4 - Math.abs(sw) * 2, 9, pants); }
  // задняя рука
  const armSw = o.air ? -0.8 : -sw;
  limb(0, -56, armSw * 14, -38, 7, o.skin);
  // туловище
  rrect(-12, -64, 24, 36, 7, o.cloth);
  if (k === "maid") rrect(-8, -52, 16, 24, 4, "#fff");
  if (k === "guest") { ctx.fillStyle = "#c9c9c9"; ctx.fillRect(-1, -64, 2, 36); }
  if (k === "manager") { ctx.fillStyle = "#d22"; ctx.beginPath(); ctx.moveTo(0, -62); ctx.lineTo(4, -48); ctx.lineTo(0, -40); ctx.lineTo(-4, -48); ctx.fill(); }
  if (k === "director") { ctx.fillStyle = "#f3c623"; ctx.beginPath(); ctx.moveTo(0, -62); ctx.lineTo(4, -48); ctx.lineTo(0, -40); ctx.lineTo(-4, -48); ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillRect(-4, -64, 8, 6); }
  if (k === "guard") { ctx.fillStyle = "#f3c623"; ctx.fillRect(3, -58, 6, 6); }
  if (k === "player") { ctx.fillStyle = "#f3c623"; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(5, -58 + i * 9, 2.2, 0, 7); ctx.fill(); } }
  // голова
  ctx.fillStyle = o.skin; ctx.beginPath(); ctx.arc(0, -75, 12, 0, 7); ctx.fill();
  // лицо
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(5, -77, 1.9, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(-1, -77, 1.9, 0, 7); ctx.fill();
  if (o.angry) {
    ctx.strokeStyle = "#111"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-4, -83); ctx.lineTo(1, -80); ctx.moveTo(9, -83); ctx.lineTo(4, -80); ctx.stroke();
    ctx.fillStyle = "#600"; ctx.beginPath(); ctx.ellipse(3, -69, 4, 3, 0, 0, 7); ctx.fill();
  } else { ctx.strokeStyle = "#733"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(3, -71, 3, 0.1, 3); ctx.stroke(); }
  // головные уборы
  if (k === "player") { rrect(-9, -91, 18, 10, 3, "#d22"); ctx.fillStyle = "#f3c623"; ctx.fillRect(-9, -83, 18, 2.5); }
  if (k === "guest") { ctx.fillStyle = "#5a3a1e"; ctx.beginPath(); ctx.arc(0, -78, 12, Math.PI, 0); ctx.fill(); }
  if (k === "maid") { rrect(-10, -90, 20, 8, 4, "#fff"); }
  if (k === "chef") { rrect(-9, -98, 18, 14, 5, "#fff"); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-5, -99, 6, 0, 7); ctx.arc(5, -99, 6, 0, 7); ctx.arc(0, -103, 6, 0, 7); ctx.fill(); }
  if (k === "guard") { rrect(-11, -91, 22, 9, 3, "#14284e"); ctx.fillStyle = "#14284e"; ctx.fillRect(2, -83, 14, 3); }
  if (k === "manager") { ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(0, -78, 12, Math.PI, 0); ctx.fill(); }
  if (k === "director") { rrect(-9, -104, 18, 20, 2, "#000"); ctx.fillStyle = "#000"; ctx.fillRect(-15, -86, 30, 4); ctx.fillStyle = "#f3c623"; ctx.fillRect(-9, -90, 18, 3); ctx.strokeStyle = "#111"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -71); ctx.lineTo(9, -71); ctx.stroke(); }
  // передняя рука
  const fx = o.knock ? 20 + o.knock * 6 : -armSw * 14 + 4, fy = o.knock ? -62 : -40 + (o.air ? -14 : 0);
  limb(2, -56, fx, fy, 7, o.skin);
  if (o.knock) { ctx.fillStyle = o.skin; ctx.beginPath(); ctx.arc(fx + 2, fy, 6, 0, 7); ctx.fill(); }
  if (k === "chef" && !o.knock) { ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(fx + 8, fy - 2, 9, 0, 7); ctx.fill(); limb(fx, fy, fx + 6, fy - 2, 3, "#555"); }
  if (k === "guard" && !o.knock) { limb(fx, fy, fx + 14, fy - 14, 4, "#111"); }
  ctx.restore();
}

/* ============ Фон: коридор ============ */
function corridor(camX, big) {
  // стена
  const g = ctx.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, "#4a2033"); g.addColorStop(1, "#6d2f43");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GY);
  const o = -((camX % 44) + 44) % 44;
  for (let x = o; x < W; x += 44) { ctx.fillStyle = "#ffffff0d"; ctx.fillRect(x, 0, 22, GY); ctx.fillStyle = "#e8c36a22"; ctx.fillRect(x + 10, 40, 2, GY - 80); }
  // потолок и плинтус
  ctx.fillStyle = "#2a1019"; ctx.fillRect(0, 0, W, 30); ctx.fillStyle = "#c9a15a"; ctx.fillRect(0, 30, W, 4);
  ctx.fillStyle = "#2d1620"; ctx.fillRect(0, GY - 16, W, 16); ctx.fillStyle = "#c9a15a"; ctx.fillRect(0, GY - 18, W, 3);
  // ковёр
  ctx.fillStyle = "#7a1620"; ctx.fillRect(0, GY, W, H - GY);
  ctx.fillStyle = "#e0b04a"; ctx.fillRect(0, GY + 10, W, 3); ctx.fillRect(0, H - 14, W, 3);
  const o2 = -((camX * 1.4 % 60) + 60) % 60;
  for (let x = o2; x < W; x += 60) { ctx.fillStyle = "#9b2030"; ctx.beginPath(); ctx.moveTo(x, GY + 40); ctx.lineTo(x + 15, GY + 28); ctx.lineTo(x + 30, GY + 40); ctx.lineTo(x + 15, GY + 52); ctx.fill(); }
  // бра
  const step = 260, first = Math.floor((camX - 40) / step) * step;
  for (let wx = first; wx < camX + W + 100; wx += step) {
    const x = wx + 130 - camX;
    ctx.fillStyle = "#ffe08a33"; ctx.beginPath(); ctx.arc(x, 120, 46, 0, 7); ctx.fill();
    ctx.fillStyle = "#f3c623"; ctx.fillRect(x - 5, 128, 10, 14); ctx.fillStyle = "#fff3b0"; ctx.beginPath(); ctx.arc(x, 118, 9, 0, 7); ctx.fill();
  }
}
function door(x, y, w, h, col, open, num) {
  ctx.fillStyle = "#1a0d12"; ctx.fillRect(x - w / 2 - 6, y - 6, w + 12, h + 6);
  ctx.fillStyle = "#0a0408"; ctx.fillRect(x - w / 2, y, w, h);
  const lw = w * (1 - Math.min(1, open) * 0.88);
  const lx = x - w / 2;
  ctx.fillStyle = col; ctx.fillRect(lx, y, lw, h);
  if (lw > w * 0.5) {
    ctx.fillStyle = "#00000030"; ctx.fillRect(lx + 8, y + 10, lw - 16, h * 0.4); ctx.fillRect(lx + 8, y + h * 0.5, lw - 16, h * 0.42);
    ctx.fillStyle = "#f3d27a"; ctx.beginPath(); ctx.arc(lx + lw - 12, y + h * 0.52, 5, 0, 7); ctx.fill();
    ctx.fillStyle = "#f3d27a"; ctx.fillRect(x - 14, y + 14, 28, 14); ctx.fillStyle = "#222"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.fillText(num, x, y + 25);
  }
}

/* ============ Игровое состояние ============ */
let state = "hub";                 // hub | knock | chase | result | ending
const sel = { floor: 0, tier: 0, door: 1 };
const doorX = [200, 400, 600];
const hub = { px: 110, t: 0, open: 0, resident: false, knockPh: 0, nums: [101, 102, 103] };
let chase = null, floats = [], shake = 0;
const input = { sprint: false, jump: false };

const $ = id => document.getElementById(id);
const show = (id, v) => $(id).classList.toggle("hidden", !v);

function toast(t, ms) { const e = $("toast"); e.textContent = t; e.classList.remove("hidden"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.add("hidden"), ms || 2600); }

function refreshHud() {
  $("coins").textContent = "💰 " + fmt(G.coins);
  const r = hotelRage();
  $("rageFill").style.width = (r * 100) + "%";
  $("rageTxt").textContent = "😡 Ярость отеля " + Math.floor(r * 100) + "%";
  if (sel.floor >= FLOORS.length || !floorOpen(sel.floor)) sel.floor = 0;
  if (sel.tier > G.tier) sel.tier = G.tier;
  const f = FLOORS[sel.floor], t = TIERS[sel.tier];
  const pct = Math.floor(Math.min(1, G.rage[sel.floor] / f.need) * 100);
  const nextLocked = sel.floor + 1 < FLOORS.length && !floorOpen(sel.floor + 1);
  $("fLbl").innerHTML = "Этаж " + (sel.floor + 1) + ": " + f.who + " <small>" + (nextLocked ? "Разозли на 100% → откроется " + FLOORS[sel.floor + 1].who : "Ярость этажа " + pct + "%") + "</small>";
  if (nextLocked) $("fLbl").querySelector("small").textContent = "Ярость " + pct + "% (100% откроет " + FLOORS[sel.floor + 1].who + ")";
  $("tLbl").innerHTML = t.name + " дверь <small>Награда: " + fmt(rewardOf(sel.floor, sel.tier)) + " 💰</small>";
  $("fPrev").disabled = sel.floor <= 0;
  $("fNext").disabled = !(sel.floor + 1 < FLOORS.length && floorOpen(sel.floor + 1));
  $("tPrev").disabled = sel.tier <= 0;
  $("tNext").disabled = sel.tier >= G.tier;
}

/* ============ Хаб ============ */
$("fPrev").onclick = () => { sel.floor--; refreshHud(); };
$("fNext").onclick = () => { sel.floor++; refreshHud(); };
$("tPrev").onclick = () => { sel.tier--; refreshHud(); };
$("tNext").onclick = () => { sel.tier++; refreshHud(); };
$("shopBtn").onclick = () => { audio(); openShop(); };
$("knock").onclick = () => { audio(); startKnock(); };
cv.addEventListener("pointerdown", e => {
  if (state === "chase") { doJump(); return; }
  if (state !== "hub") return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * (W / r.width);
  let best = 0; doorX.forEach((d, i) => { if (Math.abs(d - x) < Math.abs(doorX[best] - x)) best = i; });
  sel.door = best;
});

function startKnock() {
  if (state !== "hub") return;
  state = "knock"; hub.t = 0; hub.open = 0; hub.resident = false; hub.knockPh = 0; hub.said = false;
  show("hub", false);
}

function updKnock(dt) {
  hub.t += dt;
  const tx = doorX[sel.door] - 100;
  hub.px += (tx - hub.px) * Math.min(1, dt * 8);
  [0.45, 0.8, 1.15].forEach((k, i) => { if (hub.t >= k && hub.knockPh <= i) { hub.knockPh = i + 1; sfx.knock(); shake = 5; floats.push({ txt: "ТУК!", x: doorX[sel.door] - 20, y: 150, t: 0.7, col: "#fff", sz: 26 }); } });
  if (hub.t > 1.5) { hub.open = Math.min(1, (hub.t - 1.5) * 4); if (!hub.resident) { hub.resident = true; sfx.alarm(); floats.push({ txt: "❗", x: doorX[sel.door], y: 110, t: 1, col: "#ff0", sz: 40 }); } }
  if (hub.t > 2.15) startChase();
}

/* ============ Погоня ============ */
const baseSpeed = () => 190 + 14 * G.up.speed;
function startChase() {
  const f = FLOORS[sel.floor];
  chase = {
    px: 0, cx: -(90 + 22 * G.up.head), py: 0, vy: 0, air: false, stam: 3 + 0.8 * G.up.stam, stamMax: 3 + 0.8 * G.up.stam,
    stumble: 0, t: 0, ph: 0, cs: f.spd + sel.tier * 12, burst: 0, nextBurst: 2.5 + Math.random() * 1.5,
    L: 1500 + sel.tier * 250, obs: [], over: false, f: sel.floor, tier: sel.tier, hits: 0
  };
  let x = 420;
  while (x < chase.L - 260) {
    const type = ["cart", "bucket", "sign", "bag"][Math.floor(Math.random() * 4)];
    chase.obs.push({ x, type, hit: false });
    x += 230 + Math.random() * 200;
  }
  state = "chase"; show("chaseUI", true); input.sprint = false;
  floats.push({ txt: f.line, x: 400, y: 90, t: 1.8, col: "#ffd54a", sz: 26, screen: true });
}
const OB = { cart: { w: 54, h: 42 }, bucket: { w: 30, h: 28 }, sign: { w: 26, h: 44 }, bag: { w: 46, h: 34 } };

function doJump() { if (state === "chase" && chase && !chase.air && !chase.over) { chase.air = true; chase.vy = 640; sfx.jump(); } }

function updChase(dt) {
  const c = chase;
  if (c.over) return;
  c.t += dt;
  const sprint = input.sprint && c.stam > 0 && c.stumble <= 0;
  if (sprint) c.stam = Math.max(0, c.stam - dt); else c.stam = Math.min(c.stamMax, c.stam + dt * 0.5);
  let v = baseSpeed() * (sprint ? 1.45 : 1);
  if (c.stumble > 0) { c.stumble -= dt; v *= 0.4; }
  c.px += v * dt; c.ph += dt * (6 + v / 40);
  if (c.air) { c.py += c.vy * dt; c.vy -= 1900 * dt; if (c.py <= 0) { c.py = 0; c.air = false; } }
  // препятствия
  for (const o of c.obs) {
    if (o.hit) continue;
    const d = OB[o.type];
    if (c.px + 10 > o.x - d.w / 2 && c.px - 10 < o.x + d.w / 2 && c.py < d.h - 4) { o.hit = true; c.stumble = 0.7; c.hits++; sfx.hit(); shake = 8; floats.push({ txt: "АЙ!", x: c.px, y: 230, t: 0.7, col: "#f55", sz: 24 }); }
  }
  // преследователь
  c.nextBurst -= dt;
  if (c.nextBurst <= 0) { c.burst = 1; c.nextBurst = 3 + Math.random() * 2; sfx.alarm(); }
  let cv_ = c.cs; if (c.burst > 0) { c.burst -= dt; cv_ *= 1.35; }
  c.cx += cv_ * dt;
  if (c.px - c.cx < 26) return endChase(false);
  if (c.px >= c.L) return endChase(true);
}

function endChase(win) {
  const c = chase; c.over = true; state = "result"; show("chaseUI", false);
  const f = FLOORS[c.f];
  if (win) {
    const r = rewardOf(c.f, c.tier);
    G.coins += r; G.total += r; G.runs++;
    const before = G.rage[c.f];
    G.rage[c.f] = Math.min(f.need, before + 1);
    const wasAll = G.allAngry;
    if (!G.allAngry && FLOORS.every((ff, i) => G.rage[i] >= ff.need)) G.allAngry = true;
    save(); sfx.coin(); refreshHud();
    let extra = "";
    if (before < f.need && G.rage[c.f] >= f.need) extra = "<p>🔥 <b>" + f.who + "</b>: ярость 100%!" + (c.f + 1 < FLOORS.length ? " Открыт этаж " + (c.f + 2) + " — " + FLOORS[c.f + 1].who + "." : "") + "</p>";
    if (G.allAngry && !wasAll) extra += "<p>😡 <b>ВЕСЬ ОТЕЛЬ РАЗБЕШЕН!</b> Даже директор. Ходят слухи: у кого миллион монет — тот может взять в магазине кое-что особенное…</p>";
    modal("<h1>🏃 Сбежал!</h1><p>+" + fmt(r) + " 💰</p><p>Стукнул " + f.who.toLowerCase() + "а — теперь он в бешенстве.</p>" + extra +
      "<div class='btns'><button id='mAgain' class='main'>✊ Ещё раз</button><button id='mShop'>🛒 Прокачка</button><button id='mHub'>В коридор</button></div>");
    $("mAgain").onclick = () => { closeModal(); toHub(); startKnock(); };
  } else {
    sfx.caught(); shake = 12;
    modal("<h1>😵 Поймали!</h1><p>" + f.who + " тебя догнал. Монет не получено.</p><p>Совет: прокачай скорость, выносливость и фору — или выбери дверь попроще.</p>" +
      "<div class='btns'><button id='mAgain' class='main'>↻ Ещё раз</button><button id='mShop'>🛒 Прокачка</button><button id='mHub'>В коридор</button></div>");
    $("mAgain").onclick = () => { closeModal(); toHub(); startKnock(); };
  }
  $("mShop").onclick = () => { closeModal(); toHub(); openShop(); };
  $("mHub").onclick = () => { closeModal(); toHub(); };
  if (G.coins >= BOMB_PRICE && !G.hinted) { G.hinted = true; save(); setTimeout(() => toast("☢ В магазине появилось что-то особенное…", 4500), 600); }
}
function toHub() { state = "hub"; chase = null; hub.px = 110; hub.open = 0; hub.resident = false; show("hub", true); show("chaseUI", false); refreshHud(); }

/* ============ Окна ============ */
function modal(html) { const m = $("modal"); m.innerHTML = "<div class='card'>" + html + "</div>"; m.classList.remove("hidden"); }
function closeModal() { $("modal").classList.add("hidden"); $("modal").innerHTML = ""; }

function openShop() {
  const wasHub = state === "hub";
  const html = () => {
    let s = "<div class='shop card'><div class='top'><span>🛒 Прокачка</span><span>💰 " + fmt(G.coins) + "</span></div><div class='list'>";
    if (G.coins >= BOMB_PRICE) s += "<h3>☢ СЕКРЕТ</h3><div class='item bomb'><div class='ic'>☢</div><div class='tx'>Ядерная бомба<small>Ты накопил миллион. Директор побледнел…</small></div><button data-bomb='1'>ВЗЯТЬ</button></div>";
    s += "<h3>Навыки</h3>";
    for (const k in UPS) {
      const u = UPS[k], l = G.up[k], maxed = l >= u.max, cost = upCost(k);
      s += "<div class='item'><div class='ic'>" + u.ic + "</div><div class='tx'>" + u.name + " · ур. " + l + "/" + u.max + "<small>" + u.desc(l) + (maxed ? "" : " → " + u.desc(l + 1).split("(")[0]) + "</small></div><button data-up='" + k + "' " + (maxed || G.coins < cost ? "disabled" : "") + ">" + (maxed ? "МАКС" : fmt(cost) + " 💰") + "</button></div>";
    }
    s += "<h3>Более прочные двери (больше награда, но и погоня злее)</h3>";
    TIERS.forEach((t, i) => {
      const owned = i <= G.tier, can = i === G.tier + 1;
      s += "<div class='item'><div class='ic' style='color:" + t.col + "'>🚪</div><div class='tx'>" + t.name + " дверь · ×" + t.mult + "<small>Награда ×" + t.mult + ", охотник быстрее на +" + (i * 12) + "</small></div><button data-door='" + i + "' " + (owned || !can || G.coins < t.price ? "disabled" : "") + ">" + (owned ? "КУПЛЕНО" : fmt(t.price) + " 💰") + "</button></div>";
    });
    s += "</div><div class='btns'><button id='shopClose' class='main'>Закрыть</button></div></div>";
    return s;
  };
  const render = () => {
    const sc = $("modal").querySelector(".list"); const top = sc ? sc.scrollTop : 0;
    modal(html()); const l = $("modal").querySelector(".list"); if (l) l.scrollTop = top;
    $("shopClose").onclick = () => { closeModal(); refreshHud(); };
  };
  render();
  $("modal").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.up) { const k = b.dataset.up; if (G.coins >= upCost(k) && G.up[k] < UPS[k].max) { G.coins -= upCost(k); G.up[k]++; save(); sfx.coin(); render(); refreshHud(); } }
    else if (b.dataset.door) { const i = +b.dataset.door; if (i === G.tier + 1 && G.coins >= TIERS[i].price) { G.coins -= TIERS[i].price; G.tier = i; sel.tier = i; save(); sfx.coin(); render(); refreshHud(); } }
    else if (b.dataset.bomb) { closeModal(); $("modal").onclick = null; startEnding(); }
  };
}

/* ============ Секретная концовка ============ */
function startEnding() {
  state = "ending"; show("hub", false); show("chaseUI", false); show("ending", true);
  const t = $("endTxt"); t.style.opacity = 0;
  const say = (txt, ms, fn) => new Promise(r => { setTimeout(() => { t.style.opacity = 0; setTimeout(() => { t.innerHTML = txt; t.style.opacity = 1; if (fn) fn(); setTimeout(r, ms); }, 500); }, 0); });
  (async () => {
    await say("У тебя миллион монет 💰", 2200);
    await say("Ты спустился в подвал отеля<br>и взял ☢ <b>ядерную бомбу</b>", 2800);
    await say("Из кабинета выглядывает Директор…<br><span style='font-size:22px;opacity:.8'>«Ты же не собираешься её… использовать?»</span>", 3400);
    for (const n of ["3", "2", "1"]) { await say("<span style='font-size:90px;color:#f33'>" + n + "</span>", 900, sfx.tick); }
    sfx.boom();
    const fl = $("flash"); fl.style.transition = "opacity .15s"; fl.style.opacity = 1;
    await new Promise(r => setTimeout(r, 1800));
    t.style.opacity = 0; fl.style.transition = "opacity 2.5s"; fl.style.opacity = 0;
    await new Promise(r => setTimeout(r, 2500));
    await say("…тишина.", 2600);
    await say("Отель исчез.<br>Остался только ты, дверь без стены<br>и табличка «Не беспокоить».", 4200);
    await say("🏆<br>СЕКРЕТНАЯ КОНЦОВКА<br><span style='color:#ffd54a'>«Тихий час»</span>", 3800);
    t.style.opacity = 1;
    t.innerHTML = "🏆 СЕКРЕТНАЯ КОНЦОВКА<br><span style='color:#ffd54a'>«Тихий час»</span><div class='btns' style='margin-top:26px;display:flex;gap:12px;justify-content:center'>" +
      "<button id='endCont' style='padding:14px 22px;font-size:18px;font-weight:800;background:#6b3fa0'>Играть дальше</button>" +
      "<button id='endNew' style='padding:14px 22px;font-size:18px;font-weight:800;background:#e5481b'>Начать заново</button></div>";
    G.ended = true; save();
    $("endCont").onclick = () => { show("ending", false); toHub(); };
    $("endNew").onclick = () => { G = fresh(); save(); sel.floor = 0; sel.tier = 0; show("ending", false); toHub(); };
  })();
}

/* ============ Меню ============ */
$("menuBtn").onclick = () => {
  if (state === "ending") return;
  const prev = state === "chase" ? "chase" : null;
  modal("<h1>⚙ Меню</h1><p>Монет всего заработано: " + fmt(G.total) + "<br>Побегов: " + G.runs + "</p>" +
    "<div class='btns'><button id='mBack' class='main'>Продолжить</button><button id='mReset'>Сбросить прогресс</button></div>");
  const was = state; if (was === "chase") state = "pause";
  $("mBack").onclick = () => { closeModal(); if (was === "chase") state = "chase"; };
  $("mReset").onclick = () => {
    if (!confirm("Точно удалить весь прогресс?")) return;
    G = fresh(); save(); closeModal(); sel.floor = 0; sel.tier = 0; chase = null; toHub();
  };
};

/* ============ Ввод ============ */
const hold = (el, on, off) => { el.addEventListener("pointerdown", e => { e.preventDefault(); on(); }); ["pointerup", "pointercancel", "pointerleave"].forEach(ev => el.addEventListener(ev, off)); };
hold($("sprintBtn"), () => { input.sprint = true; $("sprintBtn").classList.add("on"); audio(); }, () => { input.sprint = false; $("sprintBtn").classList.remove("on"); });
$("jumpBtn").addEventListener("pointerdown", e => { e.preventDefault(); audio(); doJump(); });
addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); if (state === "chase") doJump(); else if (state === "hub" && $("modal").classList.contains("hidden")) startKnock(); }
  if (e.key === "Shift" || e.code === "ArrowRight") input.sprint = true;
});
addEventListener("keyup", e => { if (e.key === "Shift" || e.code === "ArrowRight") input.sprint = false; });

/* ============ Рендер ============ */
function drawObstacle(o, sx) {
  const d = OB[o.type], y = GY;
  ctx.save(); ctx.translate(sx, y);
  if (o.type === "cart") { rrect(-27, -34, 54, 26, 4, "#c9a15a"); ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(-17, -5, 6, 0, 7); ctx.arc(17, -5, 6, 0, 7); ctx.fill(); limb(-27, -34, -33, -42, 4, "#888"); rrect(-20, -42, 40, 8, 3, "#8a3a2a"); }
  if (o.type === "bucket") { ctx.fillStyle = "#3b7dd8"; ctx.beginPath(); ctx.moveTo(-14, -28); ctx.lineTo(14, -28); ctx.lineTo(10, 0); ctx.lineTo(-10, 0); ctx.fill(); ctx.fillStyle = "#9cd3ff"; ctx.fillRect(-12, -28, 24, 4); }
  if (o.type === "sign") { ctx.fillStyle = "#f6d21c"; ctx.beginPath(); ctx.moveTo(0, -44); ctx.lineTo(13, 0); ctx.lineTo(-13, 0); ctx.fill(); ctx.fillStyle = "#111"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center"; ctx.fillText("!", 0, -10); }
  if (o.type === "bag") { rrect(-23, -34, 46, 30, 6, "#2e8b57"); rrect(-23, -22, 46, 4, 0, "#1f5f3b"); limb(-8, -34, -8, -42, 3, "#222"); limb(8, -34, 8, -42, 3, "#222"); limb(-8, -42, 8, -42, 3, "#222"); ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(-14, -2, 3, 0, 7); ctx.arc(14, -2, 3, 0, 7); ctx.fill(); }
  ctx.restore();
}

function drawChase() {
  const c = chase, camX = c.px - 300;
  corridor(camX);
  // двери вдоль коридора
  const step = 260, first = Math.floor((camX - 100) / step) * step;
  for (let wx = first; wx < camX + W + 100; wx += step) { const x = wx - camX + 40; if (wx > 0 && wx < c.L - 100) door(x, GY - 150, 70, 150, "#5a3820", 0, 100 + Math.floor(wx / step)); }
  // выход
  const ex = c.L + 30 - camX;
  if (ex < W + 120) { door(ex, GY - 210, 110, 210, "#1f8a4c", 0, "EXIT"); ctx.fillStyle = "#1fd36d"; ctx.fillRect(ex - 50, GY - 250, 100, 26); ctx.fillStyle = "#012"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center"; ctx.fillText("ВЫХОД", ex, GY - 231); }
  c.obs.forEach(o => { const sx = o.x - camX; if (sx > -60 && sx < W + 60) drawObstacle(o, sx); });
  const f = FLOORS[c.f];
  const csx = c.cx - camX;
  if (csx > -60) person(csx, GY + 6, { kind: f.kind, skin: f.skin, cloth: f.cloth, run: true, ph: c.ph + 1.5, angry: true, s: 1.2 });
  else { ctx.fillStyle = "#e5251b"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "left"; ctx.fillText("◀ 😡 " + Math.round(c.px - c.cx) + " м", 10, GY - 20); }
  if (c.burst > 0 && csx > -60) { ctx.fillStyle = "#fff8"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center"; ctx.fillText("💢", csx, GY - 150); }
  const stum = c.stumble > 0;
  person(300, GY + 6 - c.py, { kind: "player", skin: "#f1c27d", cloth: "#c8261c", run: !c.air, ph: c.ph, air: c.air, s: 1.2 + 0, angry: false });
  if (stum) { ctx.fillStyle = "#ffd54a"; ctx.font = "26px sans-serif"; ctx.textAlign = "center"; ctx.fillText("💫", 300, GY - 140 - c.py); }
  // индикаторы
  ctx.fillStyle = "#0008"; rrect(240, 40, 320, 14, 7, "#0008");
  rrect(240, 40, 320 * Math.min(1, c.px / c.L), 14, 7, "#3ec46d");
  ctx.font = "13px sans-serif"; ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.fillText("до выхода " + Math.max(0, Math.round(c.L - c.px)) + " м", 400, 68);
  rrect(14, 52, 150, 12, 6, "#0008"); rrect(14, 52, 150 * c.stam / c.stamMax, 12, 6, c.stam > 0.3 ? "#ffb02e" : "#c44");
  ctx.textAlign = "left"; ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.fillText("⚡ спринт", 18, 62);
  const gap = c.px - c.cx; ctx.textAlign = "left"; ctx.font = "bold 14px sans-serif"; ctx.fillStyle = gap < 60 ? "#ff5a4a" : "#fff"; ctx.fillText("Дистанция: " + Math.round(gap) + " м", 14, 84);
}

function drawHub() {
  corridor(0);
  const tier = TIERS[sel.tier], f = FLOORS[sel.floor];
  doorX.forEach((x, i) => {
    const active = i === sel.door;
    const open = active && state === "knock" ? hub.open : 0;
    let dx = x; if (active && state === "knock" && hub.knockPh && hub.t < hub.knockPh * 0.35 + 0.45 + 0.1 && hub.open === 0) dx += (Math.random() - 0.5) * 3;
    door(dx, GY - 200, 120, 200, tier.col, open, hub.nums[i] + sel.floor * 100);
    if (active && open > 0.05) {
      ctx.save(); ctx.beginPath(); ctx.rect(x - 60, GY - 200, 120, 200); ctx.clip();
      person(x + 4, GY + 4, { kind: f.kind, skin: f.skin, cloth: f.cloth, angry: true, flip: true, s: 1.5 + (1 - open) * 0 });
      ctx.restore();
    }
    if (!active && state === "hub") { ctx.fillStyle = "#0000"; }
  });
  // индикатор выбранной двери
  if (state === "hub") { const x = doorX[sel.door]; ctx.fillStyle = "#ffd54a"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center"; ctx.fillText("▼", x, GY - 218 + Math.sin(performance.now() / 200) * 4); }
  const kn = state === "knock" && hub.t > 0.3 && hub.t < 1.5 ? (hub.knockPh % 2 ? 1 : 0.2) : 0;
  const bob = state === "hub" ? Math.sin(performance.now() / 400) * 1.5 : 0;
  person(hub.px, GY + 6 + bob, { kind: "player", skin: "#f1c27d", cloth: "#c8261c", s: 1.5, knock: kn });
}

function drawFloats(dt) {
  floats = floats.filter(f => { f.t -= dt; return f.t > 0; });
  floats.forEach(f => { ctx.save(); ctx.globalAlpha = Math.min(1, f.t * 2); ctx.font = "900 " + f.sz + "px sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 5; ctx.strokeStyle = "#000"; const y = f.y - (1 - f.t) * 20; ctx.strokeText(f.txt, f.x, y); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, y); ctx.restore(); });
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "knock") updKnock(dt);
  if (state === "chase") updChase(dt);
  ctx.save();
  if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake = Math.max(0, shake - dt * 30); }
  ctx.clearRect(0, 0, W, H);
  if ((state === "chase" || state === "pause" || state === "result") && chase) drawChase(); else drawHub();
  drawFloats(dt);
  ctx.restore();
  requestAnimationFrame(frame);
}
refreshHud();
requestAnimationFrame(frame);
// отладка/тесты
window.__game = { get G() { return G; }, set G(v) { G = v; }, get state() { return state; }, get chase() { return chase; }, sel, refreshHud, save, startEnding, openShop };
</script>
</body>
</html>
