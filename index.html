<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Прыгун и красный кубик</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui,sans-serif;touch-action:none}
  canvas{display:block}
  #hud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:center;gap:14px;color:#fff;font-weight:700;font-size:18px;text-shadow:0 2px 4px #0008;pointer-events:none;flex-wrap:wrap}
  #hud span{background:#0006;padding:6px 12px;border-radius:10px}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000a;color:#fff;text-align:center;padding:20px}
  #msg h1{margin:0 0 10px;font-size:34px}
  #msg p{max-width:460px;line-height:1.5;margin:6px 0}
  button{font-size:20px;padding:12px 28px;border:0;border-radius:12px;background:#ffcc00;color:#222;font-weight:700;cursor:pointer;margin-top:14px}
  #pad{position:fixed;bottom:18px;left:0;right:0;display:none;justify-content:space-between;padding:0 18px;pointer-events:none}
  #pad div{pointer-events:auto;width:84px;height:84px;border-radius:50%;background:#fff5;border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;user-select:none}
  #dirs{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:6px;pointer-events:auto}
  #dirs div{width:64px;height:64px;font-size:24px}
</style>
</head>
<body>
<div id="hud"><span>🪙 Ты: <b id="s1">0</b></span><span>🏠 Сосед: <b id="s2">0</b></span><span>❤️ <b id="lv">3</b></span><span>Осталось монет: <b id="left">0</b></span></div>
<div id="pad">
  <div id="dirs"><span></span><div data-k="up">▲</div><span></span><div data-k="left">◀</div><div data-k="down">▼</div><div data-k="right">▶</div></div>
  <div id="jb">⤒</div>
</div>
<div id="msg">
  <h1>🟥 Прыгун против Красного Кубика</h1>
  <p>Собирай монеты быстрее соседа! Красный кубик гонится за тобой и за соседом.</p>
  <p><b>WASD / стрелки</b> — бег, <b>Пробел</b> — прыжок.<br>Прыгни на кубик сверху — он оглушится на 3 секунды!<br>Победит тот, у кого монет больше.</p>
  <button id="start">Играть</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 40, 90);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

scene.add(new THREE.HemisphereLight(0xffffff, 0x558855, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(20, 40, 10); sun.castShadow = true;
sun.shadow.camera.left = sun.shadow.camera.bottom = -35;
sun.shadow.camera.right = sun.shadow.camera.top = 35;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

const ARENA = 28;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(ARENA*2, ARENA*2), new THREE.MeshLambertMaterial({color:0x5cb85c}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// platforms: x,y(top),z,w,d
const platDefs = [
  [-8,1.2,-6,5,5],[-3,2.2,-9,4,4],[4,1.2,-10,5,4],[10,2.2,-5,4,4],
  [10,1.2,5,5,5],[4,2.2,10,4,4],[-5,1.2,9,5,4],[-12,2.2,3,4,4],
  [0,1.2,0,4,4],[18,1.2,-16,5,5],[-18,1.2,-14,5,5],[-18,1.2,16,5,5],[17,1.2,16,5,5]
];
const plats = [];
platDefs.forEach(([x,top,z,w,d]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, top, d), new THREE.MeshLambertMaterial({color: 0xc98b4a}));
  m.position.set(x, top/2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(w+0.02, 0.15, d+0.02), new THREE.MeshLambertMaterial({color:0x7ed957}));
  cap.position.set(x, top, z); scene.add(cap);
  plats.push({x, top, z, hw:w/2, hd:d/2});
});

// neighbor's house (decor)
const house = new THREE.Group();
const hb = new THREE.Mesh(new THREE.BoxGeometry(6,4,6), new THREE.MeshLambertMaterial({color:0xf2e2b8}));
hb.position.y = 2; const roof = new THREE.Mesh(new THREE.ConeGeometry(5,2.5,4), new THREE.MeshLambertMaterial({color:0xb03a2e}));
roof.position.y = 5.2; roof.rotation.y = Math.PI/4; house.add(hb, roof);
house.position.set(-22, 0, -22); scene.add(house);
const house2 = house.clone(); house2.position.set(22,0,-22);
house2.children[1].material = new THREE.MeshLambertMaterial({color:0x2e86c1}); scene.add(house2);

// trees
for (let i=0;i<14;i++){
  const a = i/14*Math.PI*2, r = ARENA+3+Math.random()*4;
  const t = new THREE.Group();
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.4,.5,3,8), new THREE.MeshLambertMaterial({color:0x6b4423})); tr.position.y=1.5;
  const lf = new THREE.Mesh(new THREE.SphereGeometry(2,10,8), new THREE.MeshLambertMaterial({color:0x2e8b57})); lf.position.y=4;
  t.add(tr,lf); t.position.set(Math.cos(a)*r,0,Math.sin(a)*r); scene.add(t);
}

// humanoid
function makeHuman(shirt, pants, skin=0xffd2a6){
  const g = new THREE.Group();
  const mk = (geo,col,x,y,z) => { const m = new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:col})); m.position.set(x,y,z); m.castShadow=true; g.add(m); return m; };
  mk(new THREE.BoxGeometry(.7,.8,.4), shirt, 0,1.1,0);
  mk(new THREE.SphereGeometry(.32,12,10), skin, 0,1.75,0);
  mk(new THREE.BoxGeometry(.1,.1,.05), 0x000000, -.12,1.78,.3);
  mk(new THREE.BoxGeometry(.1,.1,.05), 0x000000, .12,1.78,.3);
  const mkLimb = (col,x,y) => { const p = new THREE.Group(); p.position.set(x,y,0);
    const m = new THREE.Mesh(new THREE.BoxGeometry(.25,.7,.25), new THREE.MeshLambertMaterial({color:col})); m.position.y=-.3; m.castShadow=true; p.add(m); g.add(p); return p; };
  g.armL = mkLimb(skin,-.5,1.45); g.armR = mkLimb(skin,.5,1.45);
  g.legL = mkLimb(pants,-.18,.7); g.legR = mkLimb(pants,.18,.7);
  scene.add(g); return g;
}

function makeActor(model, x, z){
  return {m:model, x, y:0, z, vy:0, vx:0, vz:0, ground:true, face:0, stun:0, inv:0, walk:0};
}
const player = makeActor(makeHuman(0x2e86ff, 0x333366), 0, 12);
const neighbor = makeActor(makeHuman(0x2ecc71, 0x555533, 0xe8b88a), -6, 14);
const red = {x:0,y:0,z:-20,vy:0,stun:0,size:1.6};
const redMesh = new THREE.Mesh(new THREE.BoxGeometry(1.6,1.6,1.6), new THREE.MeshLambertMaterial({color:0xe01b1b}));
redMesh.castShadow = true; scene.add(redMesh);
[-.35,.35].forEach(dx => { const e = new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.1), new THREE.MeshBasicMaterial({color:0xffffff}));
  e.position.set(dx,.25,.82); const p = new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.05), new THREE.MeshBasicMaterial({color:0}));
  p.position.set(dx,.25,.88); redMesh.add(e,p); });
const brow = new THREE.Mesh(new THREE.BoxGeometry(1.1,.12,.05), new THREE.MeshBasicMaterial({color:0x330000})); brow.position.set(0,.5,.85); redMesh.add(brow);

// coins
const coins = [];
const coinGeo = new THREE.CylinderGeometry(.4,.4,.1,20); coinGeo.rotateX(Math.PI/2);
const coinMat = new THREE.MeshLambertMaterial({color:0xffd700, emissive:0x554400});
function addCoin(x,y,z){ const m = new THREE.Mesh(coinGeo, coinMat); m.position.set(x,y,z); m.castShadow = true; scene.add(m); coins.push(m); }
plats.forEach(p => addCoin(p.x, p.top+0.9, p.z));
for (let i=0;i<12;i++) addCoin((Math.random()*2-1)*(ARENA-3), 0.9, (Math.random()*2-1)*(ARENA-3));
const TOTAL = coins.length;

// input
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code==='Space') e.preventDefault(); });
addEventListener('keyup', e => keys[e.code] = false);
document.querySelectorAll('#dirs div').forEach(b => {
  const code = {up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[b.dataset.k];
  b.addEventListener('touchstart', e => {e.preventDefault(); keys[code]=true;}); b.addEventListener('touchend', () => keys[code]=false);
});
$('jb').addEventListener('touchstart', e => {e.preventDefault(); keys.Space = true;}); $('jb').addEventListener('touchend', () => keys.Space=false);
if ('ontouchstart' in window) $('pad').style.display = 'flex';

// physics
const G = 26, JUMP = 11, R = 0.4;
function groundAt(a, prevY){
  let g = 0;
  for (const p of plats){
    if (Math.abs(a.x-p.x) < p.hw+R*0.6 && Math.abs(a.z-p.z) < p.hd+R*0.6 && prevY >= p.top-0.25 && p.top > g) g = p.top;
  }
  return g;
}
function physics(a, dt){
  const prev = a.y;
  a.vy -= G*dt; a.y += a.vy*dt;
  const g = groundAt(a, prev);
  if (a.y <= g && a.vy <= 0){ a.y = g; a.vy = 0; a.ground = true; } else a.ground = false;
  a.x = Math.max(-ARENA+1, Math.min(ARENA-1, a.x)); a.z = Math.max(-ARENA+1, Math.min(ARENA-1, a.z));
}
function animate(a, dt, speed){
  a.walk += speed*dt*1.5;
  const s = Math.sin(a.walk)*Math.min(1, speed/5);
  a.m.legL.rotation.x = s; a.m.legR.rotation.x = -s; a.m.armL.rotation.x = -s; a.m.armR.rotation.x = s;
  if (!a.ground){ a.m.armL.rotation.x = a.m.armR.rotation.x = -2.5; }
  a.m.position.set(a.x, a.y, a.z); a.m.rotation.y = a.face;
  a.m.visible = a.inv > 0 ? Math.floor(a.inv*10)%2===0 : true;
}

let s1=0, s2=0, lives=3, running=false, over=false, time=0;
function updHud(){ $('s1').textContent=s1; $('s2').textContent=s2; $('lv').textContent=lives; $('left').textContent=coins.length; }

function updatePlayer(dt){
  const a = player; a.inv = Math.max(0, a.inv-dt);
  let dx = (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0);
  let dz = (keys.KeyS||keys.ArrowDown?1:0) - (keys.KeyW||keys.ArrowUp?1:0);
  const l = Math.hypot(dx,dz); const SP = 8;
  if (l>0){ dx/=l; dz/=l; a.face = Math.atan2(dx,dz); }
  a.x += dx*SP*dt + a.vx*dt; a.z += dz*SP*dt + a.vz*dt;
  a.vx *= 0.9; a.vz *= 0.9;
  if (keys.Space && a.ground){ a.vy = JUMP; a.ground = false; }
  physics(a, dt); animate(a, dt, l*SP);
}

function updateNeighbor(dt){
  const a = neighbor; a.inv = Math.max(0, a.inv-dt);
  let speed = 0;
  if (a.stun > 0){ a.stun -= dt; }
  else if (coins.length){
    let best=null, bd=1e9;
    coins.forEach(c => { const d = Math.hypot(c.position.x-a.x, c.position.z-a.z) + Math.max(0,c.position.y-a.y-.9)*4; if (d<bd){bd=d;best=c;} });
    const dx = best.position.x-a.x, dz = best.position.z-a.z, d = Math.hypot(dx,dz);
    const SP = 6.2;
    if (d>0.1){ a.x += dx/d*SP*dt; a.z += dz/d*SP*dt; a.face = Math.atan2(dx,dz); speed = SP; }
    if (a.ground && best.position.y-0.9 > a.y+0.3 && d < 3.5) { a.vy = JUMP; }
  }
  physics(a, dt); animate(a, dt, speed);
}

function updateRed(dt){
  const r = red; let tx, tz;
  const dp = Math.hypot(player.x-r.x, player.z-r.z), dn = Math.hypot(neighbor.x-r.x, neighbor.z-r.z);
  const t = dp <= dn*1.2 ? player : neighbor; tx = t.x; tz = t.z;
  if (r.stun > 0){ r.stun -= dt; redMesh.rotation.y += dt*8; redMesh.material.color.setHex(0x992222); }
  else {
    redMesh.material.color.setHex(0xe01b1b);
    const dx = tx-r.x, dz = tz-r.z, d = Math.hypot(dx,dz), SP = 4.6 + time*0.015;
    if (d>0.1){ r.x += dx/d*SP*dt; r.z += dz/d*SP*dt; redMesh.rotation.y = Math.atan2(dx,dz); }
    if (r.y<=0.01 && (t.y-r.y)>0.8 && d<5) r.vy = 9; // hop to follow
  }
  r.vy -= G*dt; r.y += r.vy*dt;
  const g = groundAt({x:r.x,z:r.z}, r.y+0.3);
  if (r.y<=g){ r.y=g; r.vy=0; }
  redMesh.position.set(r.x, r.y+0.8, r.z);
  if (r.stun>0) redMesh.position.y += 0;

  // collisions
  [[player,true],[neighbor,false]].forEach(([a,isP]) => {
    const dx = a.x-r.x, dz = a.z-r.z, d = Math.hypot(dx,dz);
    if (d < 1.2 && Math.abs(a.y - r.y) < 1.9){
      const stomp = a.vy < -1 && a.y > r.y + 1.0;
      if (stomp){ r.stun = 3; a.vy = 9; if (isP) flash('Топ! Кубик оглушён 😵'); }
      else if (r.stun<=0 && a.inv<=0){
        a.inv = 2; const n = d||1; a.vx = dx/n*18; a.vz = dz/n*18; a.vy = 8;
        if (isP){ lives--; updHud(); if (lives<=0) end(false); }
        else { a.stun = 3; }
      }
    }
  });
}

function collect(a, isP){
  for (let i=coins.length-1;i>=0;i--){
    const c = coins[i];
    if (Math.hypot(c.position.x-a.x, c.position.z-a.z) < 1.1 && Math.abs(c.position.y-(a.y+0.9)) < 1.3){
      scene.remove(c); coins.splice(i,1); if (isP) s1++; else s2++; updHud();
      if (!coins.length) end(true);
    }
  }
}

let flashT = 0;
const toast = document.createElement('div');
toast.style.cssText = 'position:fixed;top:60px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:22px;text-shadow:0 2px 4px #000a;pointer-events:none';
document.body.appendChild(toast);
function flash(t){ toast.textContent = t; clearTimeout(flashT); flashT = setTimeout(()=>toast.textContent='', 1500); }

function end(natural){
  over = true; running = false;
  let title;
  if (lives<=0) title = '💥 Красный кубик победил!';
  else if (s1>s2) title = '🏆 Ты победил соседа!';
  else if (s1<s2) title = '😤 Сосед собрал больше монет!';
  else title = '🤝 Ничья с соседом!';
  $('msg').innerHTML = `<h1>${title}</h1><p>Твои монеты: ${s1} · Сосед: ${s2}</p><button onclick="location.reload()">Ещё раз</button>`;
  $('msg').style.display = 'flex';
}

const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (running){
    time += dt;
    updatePlayer(dt); updateNeighbor(dt); updateRed(dt);
    collect(player, true); collect(neighbor, false);
  }
  coins.forEach(c => c.rotation.y += dt*3);
  // camera
  const cx = player.x, cz = player.z + 12, cy = player.y + 9;
  camera.position.x += (cx-camera.position.x)*0.08; camera.position.y += (cy-camera.position.y)*0.08; camera.position.z += (cz-camera.position.z)*0.08;
  camera.lookAt(player.x, player.y+1, player.z);
  renderer.render(scene, camera);
}
camera.position.set(0, 9, 24);
updHud(); loop();
animate(player,0,0); animate(neighbor,0,0);
$('start').onclick = () => { $('msg').style.display='none'; running = true; };
</script>
</body>
</html>
